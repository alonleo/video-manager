[project]
name = "video-manage-backend"
version = "0.1.0"
description = "个人视频管理平台后端"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "arq>=0.26",
    "redis>=5.2",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "xxhash>=3.5",
    "aiosqlite>=0.22.1",
    "yt-dlp[default]>=2026.3.3",
    "secretstorage>=3.3.3 ; sys_platform == 'linux'",
    "playwright>=1.55,<2",
    "pillow>=12,<13",
    "pillow-heif>=1,<2",
    "cryptography>=44,<51",
    "edge-tts>=7.2,<8",
    "numpy>=2,<3",
]

[project.optional-dependencies]
subtitles = ["faster-whisper>=1.1,<2", "sentencepiece>=0.2,<1", "ctranslate2>=4.6,<5"]
asr = [
    "faster-whisper>=1.1",
    "funasr>=1.1",
    "onnxruntime>=1.20",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI 的 `Depends()` / `Query()` 作参数默认值是官方推荐写法，
#       不是「在默认值里做函数调用」的可变默认参数陷阱。
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
